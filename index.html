<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🧮 Calculadora Simples</h1>
    
    <div class="calculator">
      <input type="number" id="num1" placeholder="Número 1">
      <input type="number" id="num2" placeholder="Número 2">

      <div class="buttons">
        <button onclick="calcular('+')">➕ Soma</button>
        <button onclick="calcular('-')">➖ Subtração</button>
        <button onclick="calcular('*')">✖️ Multiplicação</button>
        <button onclick="calcular('/')">➗ Divisão</button>
      </div>

      <h2 id="resultado">Resultado: --</h2>
    </div>

    <div class="history">
      <h3>📜 Histórico de cálculos</h3>
      <ul id="historico"></ul>
    </div>

    <button id="theme-toggle">🌙 Alternar Tema</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
